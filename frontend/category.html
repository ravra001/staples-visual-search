<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Category | Staples</title>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>

<div id="site-header"></div>

<main class="listing-page">
  <div class="listing-shell">
    <aside class="filter-rail">
      <h3>Filter</h3>
      <div class="filter-group">
        <h4>Price</h4>
        <label><input type="checkbox" checked disabled /> Under $50</label>
        <label><input type="checkbox" checked disabled /> $50 – $150</label>
        <label><input type="checkbox" checked disabled /> $150 – $300</label>
        <label><input type="checkbox" checked disabled /> $300+</label>
      </div>
      <div class="filter-group">
        <h4>Rating</h4>
        <label><input type="checkbox" checked disabled /> 4 Stars &amp; Up</label>
        <label><input type="checkbox" checked disabled /> 3 Stars &amp; Up</label>
      </div>
    </aside>
    <div class="listing-main">
      <h1 id="listing-title">Products</h1>
      <p id="listing-count" class="listing-count"></p>
      <div id="listing-grid" class="product-grid"></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/assets/app.js"></script>
<script>
  renderSiteChrome();
  const params = new URLSearchParams(location.search);
  const category = params.get('category');
  const query = params.get('q');
  // reflect the active query back into the search box
  if (query) { const inp = document.getElementById('text-search-input'); if (inp) inp.value = query; }
  renderListingPage({ category, query });
  wireVisualSearch('camera-btn', 'visual-search-input');
  wireTextSearch();
</script>
</body>
</html>
