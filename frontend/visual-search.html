<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visual Search Results | Staples</title>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>

<div id="site-header"></div>

<main class="listing-page">
  <div class="visual-search-banner">
    <figure class="vs-query-card">
      <span class="vs-query-label">Your photo</span>
      <div class="vs-query-frame">
        <img id="query-thumb" alt="The photo you uploaded" />
      </div>
    </figure>
    <div class="vs-query-meta">
      <h1>Visual search results</h1>
      <p id="vs-status">Analyzing your photo…</p>
      <div id="vs-category-chip" class="vs-chip" hidden></div>
      <p class="vs-query-hint">We embedded your photo and ranked the catalog by visual similarity.</p>
    </div>
  </div>

  <div class="listing-shell">
    <div class="listing-main" style="width:100%;">
      <div id="listing-grid" class="product-grid"></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/assets/app.js"></script>
<script>
  renderSiteChrome();
  renderVisualSearchResultsPage();
  wireVisualSearch('camera-btn', 'visual-search-input');
  wireTextSearch();
</script>
</body>
</html>
