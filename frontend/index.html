<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staples | Office Supplies, Furniture &amp; Technology</title>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="hero">
    <div class="hero-inner">
      <span class="hero-eyebrow">New · Search by Photo</span>
      <h1>Everything your workspace needs.</h1>
      <p>Snap a photo of what you need — broken cable, empty cartridge, worn-out chair — and we'll find it for you.</p>
      <button id="hero-camera-btn" class="hero-cta">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:6px;">
          <path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/>
          <circle cx="12" cy="12.5" r="3.5"/>
        </svg>
        Try Visual Search
      </button>
    </div>
  </section>

  <section class="rail-section featured-section">
    <div class="section-head">
      <h2>Featured products</h2>
      <a class="see-all" href="/category.html">See all products →</a>
    </div>
    <div id="featured-grid" class="product-grid"></div>
  </section>

  <section class="category-grid-section">
    <h2>Shop by Category</h2>
    <div id="category-grid" class="category-grid"></div>
  </section>

  <section class="rail-section">
    <h2>Deals just for you</h2>
    <div id="deals-rail" class="product-rail"></div>
  </section>

  <section class="rail-section">
    <h2>Popular right now</h2>
    <div id="chairs-rail" class="product-rail"></div>
  </section>
</main>

<div id="site-footer"></div>

<input id="visual-search-input-hero" type="file" accept="image/*" hidden />

<script src="/assets/app.js"></script>
<script>
  renderSiteChrome();
  renderSampleProducts('featured-grid');
  renderCategoryGrid('category-grid');
  renderProductRail('deals-rail', { limit: 6, offset: 0 });
  renderProductRail('chairs-rail', { limit: 6, offset: 6 });
  wireVisualSearch('camera-btn', 'visual-search-input');
  wireVisualSearch('hero-camera-btn', 'visual-search-input-hero');
  wireTextSearch();
</script>
</body>
</html>
