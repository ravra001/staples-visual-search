# =====================================================================
# Staples Visual Search — application configuration
# =====================================================================
# Edit this file to configure the app; no environment variables needed.
# (Env vars, if set, still override these values — handy for CI/ops.)
# Point at a different file with the APP_CONFIG env var if you like.

embedding:
  # Which image-embedding backend to use:
  #   heuristic  — colour/shape/edge math, zero deps, fully offline
  #   clip       — local OpenCLIP model (real semantic search)
  #   vertex     — Google Vertex AI Multimodal Embeddings
  backend: clip

  clip:
    model: ViT-B-32
    pretrained: laion2b_s34b_b79k
    # Where the CLIP model lives (relative to backend/). Bundled here so the
    # app runs offline. Keep in sync with the prebuilt index_clip.npz.
    cache_dir: models/hf
    # offline: auto | true | false
    #   auto  — run offline when the model is present in cache_dir (recommended)
    #   true  — always offline (fail rather than download)
    #   false — allow HuggingFace downloads
    offline: auto

  # Catalog-side image+text fusion (clip backend only). Validated by a held-out
  # recall eval (backend/experimental/eval_text_fusion.py): fusing each
  # product's image with its name/brand/description text beat image-only
  # retrieval by +8pts recall@1 at image_weight=0.3 on a 497-product sample.
  # Zero query-time cost — only affects how catalog vectors are built.
  text_fusion:
    enabled: true
    image_weight: 0.3   # text weight = 1 - image_weight

  vertex:
    project: null          # your GCP project id (backend: vertex)
    location: us-central1

data:
  # memory — in-RAM catalog (default) | sql — Cloud SQL / SQLite via database_url
  backend: memory
  # Catalog to load. null = built-in 30-item demo. Use the 10k set:
  catalog_file: data/catalog_abo.json
  database_url: null       # e.g. sqlite:///data/catalog.db  (backend: sql)

search:
  top_k: 8
  page_size: 48          # default page size for /api/products and /api/search
  max_upload_mb: 10      # reject visual-search uploads larger than this
  # Visual-search results below this % match are treated as "weak" (the query
  # item probably isn't in the catalog) — the UI hides them behind an expander
  # and shows a "no strong matches" state. Tune per model/catalog.
  #
  # NOTE: this value is coupled to embedding.text_fusion. A pure-image query
  # compared against a FUSED (image+text) catalog vector scores meaningfully
  # lower than image-vs-image, because averaging in text pulls the vector
  # direction away from pure image space. Measured on the live 10k index after
  # enabling fusion (image_weight=0.3): genuine matches ~60-65%, an
  # out-of-domain probe ~41-46% -- midpoint ~53. (Pre-fusion this was 55, based
  # on genuine ~87-100% vs out-of-domain ~35-45%.) If you change text_fusion's
  # enabled flag or image_weight, re-measure and update this value.
  match_threshold: 53
  category_classifier:
    enabled: true
    confidence_threshold: 45.0   # % — auto-scope search above this confidence
    softmax_temperature: 0.07    # lower = sharper confidence scores

index:
  # If true, refuse to embed the catalog at startup (fail fast) instead of
  # re-embedding on a cache miss. Set true in production (Cloud Run) so a
  # cold-start never fires thousands of embedding calls — ship a prebuilt index.
  require_prebuilt: false

server:
  host: 127.0.0.1
  port: 8000
  reload: false
  # Allowed CORS origins. "*" is fine for a local demo; lock to your domain(s)
  # for a public deployment.
  cors_origins: ["*"]
