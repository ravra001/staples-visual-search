# Cloud Build config for continuous deployment: triggered on every push to
# `main` (once the GitHub trigger below is created), builds the image and
# deploys it to the EXISTING Cloud Run service. Deliberately does NOT
# re-specify --add-cloudsql-instances / --set-secrets / --min-instances /
# --concurrency / --memory / --cpu: gcloud run deploy retains whatever the
# current revision already has for any flag you don't pass, so omitting
# them here means "redeploy with the new image, touch nothing else" rather
# than risking this file drifting out of sync with the real service config
# and silently resetting something on the next auto-deploy.
# Defaults match what's actually deployed today -- override per-trigger in
# the Cloud Build console (Settings > Substitution variables) rather than
# editing this file, so the real bucket/host name isn't hardcoded into a
# public repo (harmless as bare identifiers, but no reason to bake them in).
substitutions:
  _MODEL_BUCKET: 'opportune-box-136509-deploy-src'
  _IMAGES_BASE_URL: 'https://34-110-248-3.sslip.io'

steps:
# backend/models/ (the ~577MB bundled CLIP model) is .gitignore'd -- it
# exceeds GitHub's 100MB file limit and was only ever included in earlier
# deploys via a local tarball that bypassed git entirely. A build triggered
# from a GitHub checkout doesn't have it, so fetch it from GCS -- staged
# there once, out of band, as a single zip (a folder upload of thousands of
# small model-cache files through the browser silently dropped files) --
# and unpack it into the build context before docker build runs.
- name: 'gcr.io/cloud-builders/gsutil'
  args: ['cp', 'gs://${_MODEL_BUCKET}/model-cache/hf_model.zip', 'hf_model.zip']
- name: 'python:3.11-slim'
  entrypoint: 'python'
  args: ['-c', "import zipfile; zipfile.ZipFile('hf_model.zip').extractall('backend/models')"]
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/staples-repo/staples-visual-search:$SHORT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/staples-repo/staples-visual-search:$SHORT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'staples-visual-search'
  - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/staples-repo/staples-visual-search:$SHORT_SHA'
  - '--region=us-central1'
  # One deliberate exception to the "don't re-specify flags" policy at the
  # top of this file: this pins product images to the GCS/Cloud CDN origin
  # set up in GCP_SETUP.md step 13 (verified ACTIVE + serving before this
  # was added). --set-env-vars replaces the full env var list, but doesn't
  # touch --set-secrets (DATABASE_URL is a secret, a separate namespace).
  # GCP_PROJECT is for the Staples AI chat agent (backend/agent.py) to call
  # Vertex Gemini -- uses Cloud Build's own built-in $PROJECT_ID substitution
  # rather than a hardcoded/custom one, so the real project ID never has to
  # be committed anywhere in this public repo.
  - '--set-env-vars=IMAGES_BASE_URL=${_IMAGES_BASE_URL},GCP_PROJECT=$PROJECT_ID'

images:
- 'us-central1-docker.pkg.dev/$PROJECT_ID/staples-repo/staples-visual-search:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY   # required when the build runs under a non-default service account
